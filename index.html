<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Typo — Tanglish to English</title>
<meta name="theme-color" content="#A83250">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Typo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFBF2;
    --ink: #2B2130;
    --maroon: #A83250;
    --teal: #1B6B93;
    --mustard: #E8A33D;
    --panel: #FFFFFF;
    --line: #E8DFC8;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    padding: 14px 16px;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
  }

  h1 span { color: var(--maroon); }

  .tagline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #9a8c7a;
  }

  .stage {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 32px 1fr;
    gap: 0;
  }

  @media (max-width: 640px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 24px 1fr; }
    .kolam svg { transform: rotate(90deg); }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9a8c7a;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  textarea, .output-text {
    flex: 1;
    min-height: 0;
    border: none;
    resize: none;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    outline: none;
    overflow-y: auto;
  }

  .output-text {
    white-space: pre-wrap;
    color: #4a3f4c;
  }

  .output-text.placeholder { color: #b8aebb; }

  .kolam {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .kolam svg { width: 100%; height: 100%; }

  .kolam-dot { fill: var(--mustard); transition: fill 0.4s; }
  .kolam.active .kolam-dot { fill: var(--maroon); }

  .kolam-line {
    stroke: var(--line);
    stroke-width: 1.4;
    fill: none;
    stroke-dasharray: 4 220;
  }
  .kolam.active .kolam-line {
    stroke: var(--teal);
    animation: flow 1.2s linear infinite;
  }
  @keyframes flow { to { stroke-dashoffset: -224; } }

  .controls {
    flex-shrink: 0;
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
  }

  .hint {
    font-size: 12px;
    color: #9a8c7a;
    margin-right: auto;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: 999px;
    padding: 11px 20px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  #convertBtn { background: var(--maroon); color: white; }
  #convertBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(168,50,80,0.3); }
  #convertBtn:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }

  #copyBtn {
    background: transparent;
    color: var(--teal);
    border: 1.5px solid var(--teal);
  }
  #copyBtn:hover { background: rgba(27,107,147,0.08); }

  #installBtn {
    background: transparent;
    color: var(--mustard);
    border: 1.5px solid var(--mustard);
    display: none;
  }
  #installBtn:hover { background: rgba(232,163,61,0.1); }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .kolam.active .kolam-line { animation: none; }
    .spinner { animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Typ<span>o</span></h1>
  <div class="tagline">tanglish → english, in one tap</div>
</header>

<div class="stage">
  <div class="panel">
    <div class="panel-label">Your text</div>
    <textarea id="inputText" placeholder="Type or paste here... e.g. 'naan office ku late aaidum, thonguriren'"></textarea>
  </div>

  <div class="kolam" id="kolam">
    <svg viewBox="0 0 32 140" xmlns="http://www.w3.org/2000/svg">
      <path class="kolam-line" d="M16 8 C 4 30, 28 45, 16 65 C 4 85, 28 100, 16 120"/>
      <circle class="kolam-dot" cx="16" cy="8" r="3"/>
      <circle class="kolam-dot" cx="16" cy="65" r="2.5"/>
      <circle class="kolam-dot" cx="16" cy="120" r="3"/>
    </svg>
  </div>

  <div class="panel">
    <div class="panel-label">In English</div>
    <div class="output-text placeholder" id="outputText">Your clean English text will show up here.</div>
  </div>
</div>

<div class="controls">
  <div class="hint" id="hint">⌘/Ctrl + Enter also works</div>
  <button id="installBtn">Install app</button>
  <button id="copyBtn" style="display:none;">Copy</button>
  <button id="convertBtn">Convert to English</button>
</div>

<script>
  const inputText = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
  const convertBtn = document.getElementById('convertBtn');
  const copyBtn = document.getElementById('copyBtn');
  const installBtn = document.getElementById('installBtn');
  const kolam = document.getElementById('kolam');
  const hint = document.getElementById('hint');

  async function convert() {
    const text = inputText.value.trim();
    if (!text) {
      hint.textContent = 'Paste something first.';
      return;
    }

    convertBtn.disabled = true;
    convertBtn.innerHTML = '<span class="spinner"></span>Converting';
    kolam.classList.add('active');
    outputText.classList.add('placeholder');
    outputText.textContent = 'Working on it...';
    copyBtn.style.display = 'none';

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 500,
          system: "Convert Tanglish (Tamil written in English letters, mixed with English) or any other mixed-language casual text into clean, natural, correct English. If the text is already in clean English, just lightly fix any typos or grammar and return it as-is otherwise. Keep the original meaning and tone. Reply with ONLY the converted text, no preamble, no quotes, no explanation.",
          messages: [{ role: "user", content: text }]
        })
      });

      const data = await response.json();
      const result = data.content
        .map(block => block.type === "text" ? block.text : "")
        .filter(Boolean)
        .join("\n")
        .trim();

      outputText.classList.remove('placeholder');
      outputText.textContent = result || "Couldn't convert that — try rephrasing it.";
      hint.textContent = 'Done. Copy it into your chat.';
      copyBtn.style.display = 'inline-block';
    } catch (err) {
      outputText.classList.remove('placeholder');
      outputText.textContent = "Something went wrong. Please try again.";
      hint.textContent = 'Conversion failed.';
      console.error(err);
    } finally {
      convertBtn.disabled = false;
      convertBtn.textContent = 'Convert to English';
      kolam.classList.remove('active');
    }
  }

  async function copyResult() {
    try {
      await navigator.clipboard.writeText(outputText.textContent);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy', 1500);
    } catch (err) {
      hint.textContent = 'Could not copy — select the text manually.';
    }
  }

  convertBtn.addEventListener('click', convert);
  copyBtn.addEventListener('click', copyResult);
  inputText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) convert();
  });

  // --- Install as app ---
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // --- Handle text shared in from WhatsApp / Instagram / etc ---
  (function handleSharedText() {
    const params = new URLSearchParams(window.location.search);
    const shared = params.get('text') || params.get('title') || params.get('url');
    if (shared) {
      inputText.value = shared;
      hint.textContent = 'Received from share — converting...';
      convert();
      // Clean the URL so a refresh doesn't re-trigger it
      window.history.replaceState({}, '', window.location.pathname);
    }
  })();
</script>

</body>
</html>
